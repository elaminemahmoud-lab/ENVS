name: Veille Sahra

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: sahra-publication
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Les rapports sont enregistrés sur main : même une relance doit
          # partir de son état actuel, pas du commit de l'ancien essai.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Vérifier le moniteur
        run: node --test veille-monitor.test.mjs
      - name: Contrôler les sources
        id: pages
        continue-on-error: true
        run: node veille-monitor.mjs
      - name: Contrôler les médias et réseaux sociaux
        id: flux
        continue-on-error: true
        run: node flux-monitor.mjs
      - name: Signaler les échecs de collecte
        if: steps.pages.outcome == 'failure' || steps.flux.outcome == 'failure'
        run: echo "::warning::Une collecte a échoué. Consulter les journaux et la date des rapports sur le site."
      - name: Publier le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille-state.json veille-data.js veille-report.json flux-data.js flux-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour de la veille Sahra"
            # Intégrer les commits arrivés pendant la collecte, sans forcer
            # l'envoi ni écraser un changement concurrent.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Préparer uniquement les fichiers publics
        run: node publier-static.mjs
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: dist

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site actualisé
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
